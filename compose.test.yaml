name: star-test

services:
  aesmd:
    image: ghcr.io/oasisprotocol/aesmd-dcap:master
    devices:
      - /dev/sgx_enclave
      - /dev/sgx_provision
    volumes:
      - aesmd:/var/run/aesmd
      - ./sgx_default_qcnl.conf:/etc/sgx_default_qcnl.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "test -S /var/run/aesmd/aesm.socket"]
      interval: 1s
      timeout: 1s
      retries: 60

  tests:
    build:
      context: ..
      dockerfile: star/Dockerfile.bench
    environment:
      STAR_ENCLAVE_HEAP_SIZE: "8388608"
      STAR_KEY_MANAGER_HEAP_SIZE: "8388608"
      STAR_KEY_MANAGER_URL: http://127.0.0.1:8090
      STAR_KEY_MANAGER_SEALED_KEYS: /tmp/star-test-key-manager.sealed
    depends_on:
      aesmd:
        condition: service_healthy
    devices:
      - /dev/sgx_enclave
      - /dev/sgx_provision
    volumes:
      - aesmd:/run/aesmd
    command:
      - bash
      - -euc
      - |
        cargo test --manifest-path core/Cargo.toml
        cargo build --manifest-path system/serv/Cargo.toml -p key-manager-service
        ./system/serv/target/debug/key-manager-service &
        timeout 120 bash -c 'until (echo > /dev/tcp/127.0.0.1/8090) &>/dev/null; do sleep 1; done'
        cargo test --manifest-path system/serv/Cargo.toml --workspace
        STAR_ENCLAVE_SGXS=/workspace/star/system/serv/target/x86_64-fortanix-unknown-sgx/release/enclave.sgxs \
          cargo test --manifest-path system/client/Cargo.toml
        # Reuse the image built above so parallel tests do not overwrite it.
        STAR_ENCLAVE_SGXS=/workspace/star/system/serv/target/x86_64-fortanix-unknown-sgx/release/enclave.sgxs \
          cargo test --manifest-path system/serv/Cargo.toml -p star_app --lib -- --ignored
        cargo test --manifest-path system/serv/enclave/Cargo.toml --target x86_64-fortanix-unknown-sgx --lib
        cargo test --manifest-path system/serv/utils/manage-key/enclave/Cargo.toml --target x86_64-fortanix-unknown-sgx --lib

volumes:
  aesmd:

[package]
name = "enclave"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
rand = { version = "0.8", default-features = false, features = ["getrandom", "std", "std_rng"] }
star-core = { path = "../../../core" }
star_attestation = { path = "../utils/attest" }
hpke = { version = "0.11", default-features = false, features = ["alloc", "x25519"] }
aesm-client = "0.6.2"
sgx-isa = { version = "0.5.0", features = ["serde"] }
aes-gcm = "0.10"
bincode = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "1"

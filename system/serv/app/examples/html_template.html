<head>
  <meta charset="utf-8">
  <title>{{title}}</title>
</head>
<body>
  <h1>{{headline}}</h1>
  <p>{{body}}</p>
  <button onclick="submit()">Submit</button>
  <script>
    const submit = async () => {
      const star = await authStar();
      console.log("auth headers:", star.proof)
      
      const headers = new Headers({
        "Content-Type": "text/xml",
        "X-STAR": star.proof,
      });

      const resp = await fetch(`http://localhost:${star.route}/`, {
        method: "POST",
        headers,
      })

      console.log("response:", resp)
      const text = await resp.text()
      alert(text)
    }
  </script>
</body>

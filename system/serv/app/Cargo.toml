[package]
name = "star_app"
version = "0.1.0"
edition = "2024"

[dependencies]
pingora = "0.6.0"
pingora-core = "0.6.0"
pingora-http = "0.6.0"
pingora-proxy = "0.6.0"
pingora_web = "0.1.7"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

env_logger = "0.11"
log = "0.4"

constant-time-utils = { path = "../../../../constant-time-utils", default-features = false }
simple-filter-box = { path = "../../../../simple-filter-box", default-features = false }
star-core = { path = "../../../core" }
base64 = "0.22.1"
rand = "0.9.2"
rand_core = "0.6"

[dev-dependencies]
ureq = "2"
tiny_http = "0.12"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "star_filter_throughput"
harness = false

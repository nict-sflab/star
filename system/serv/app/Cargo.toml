[package]
name = "star_app"
version = "0.1.0"
edition = "2024"

[dependencies]
pingora = { version = "0.6.0", features = ["rustls"] }
pingora-core = { version = "0.6.0", features = ["rustls"] }
pingora-http = "0.6.0"
pingora-proxy = { version = "0.6.0", features = ["rustls"] }
pingora_web = "=0.1.7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

env_logger = "0.11"
log = "0.4"

constant-time-utils = { path = "../../../../constant-time-utils", default-features = false }
simple-filter-box = { path = "../../../../simple-filter-box", default-features = false }
star-core = { path = "../../../core" }
base64 = "0.22.1"
rand = "0.9.2"
rand_core = "0.6"

[features]
default = []

[dev-dependencies]
ureq = "2"
tiny_http = "0.12"
criterion = { version = "0.5", features = ["async_tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
cpu-time = "1"
anyhow = "1"

[[bench]]
name = "filter"
harness = false

[[bench]]
name = "e2e"
harness = false

[[bench]]
name = "proxy"
harness = false

[[bench]]
name = "client"
harness = false

[[bin]]
name = "bench_mock"
path = "benches/mock/mock_servers.rs"

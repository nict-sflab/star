[package]
name = "star-client-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
constant-time-utils = { path = "../../../../constant-time-utils", default-features = false }
star-core = { path = "../../../core" }
base64 = "0.22.1"
rand = { version = "0.8", default-features = false, features = ["getrandom"] }
getrandom = { version = "0.2", features = ["js"] }

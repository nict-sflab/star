services:
  aesmd:
      image: ghcr.io/oasisprotocol/aesmd-dcap:master
      devices:
        - /dev/sgx_enclave
        - /dev/sgx_provision
      volumes:
        - aesmd:/var/run/aesmd
        - ./sgx_default_qcnl.conf:/etc/sgx_default_qcnl.conf:ro

  core:
    build:
      context: ..
      dockerfile: star/Dockerfile.bench
    devices:
      - /dev/sgx_enclave
      - /dev/sgx_provision
    volumes:
      - ./bench:/workspace/star/bench
    command: >
      bash -o pipefail -c '
        RUSTFLAGS="--cfg getrandom_backend=\"rdrand\" -C target-feature=+rdrand,+avx2" cargo bench --manifest-path core/Cargo.toml --bench enclave --target x86_64-fortanix-unknown-sgx -- --discard-baseline --noplot | tee bench/serv1.log &&
        cargo bench --manifest-path core/Cargo.toml --bench user -- --discard-baseline | tee bench/user.log &&
        cargo run --manifest-path core/Cargo.toml --bin comm --release -- --discard-baseline | tee bench/comm.log
      '

  serv:
    build:
      context: ..
      dockerfile: star/Dockerfile.bench
    depends_on:
      - aesmd
    devices:
      - /dev/sgx_enclave
      - /dev/sgx_provision
    environment:
      STAR_MAX_COUNT: "1000000"
    volumes:
      - aesmd:/run/aesmd
      - ./bench:/workspace/star/bench
    command: >
      bash -o pipefail -c '
        while [ ! -S /run/aesmd/aesm.socket ]; do sleep 0.1; done;
        cargo bench --manifest-path system/serv/app/Cargo.toml --bench "*" -- --discard-baseline --noplot | tee bench/serv2.log
      '

  sidechannel:
    build:
      context: ..
      dockerfile: star/core/analysis/Dockerfile
    volumes:
      - ./bench:/workspace/star/bench

volumes:
  aesmd:

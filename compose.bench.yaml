services:
  core:
    build:
      context: ..
      dockerfile: star/Dockerfile.bench
    devices:
      - /dev/sgx_enclave:/dev/sgx_enclave
      - /dev/sgx_provision:/dev/sgx_provision
    volumes:
      - /run/aesmd/aesm.socket:/run/aesmd/aesm.socket
      - ./bench:/workspace/star/bench
      - ./core/target/criterion:/workspace/star/core/target/criterion
    command: >-
      bash -c 'socat TCP-LISTEN:5555,fork,reuseaddr UNIX-CONNECT:/run/aesmd/aesm.socket &
      cargo bench --manifest-path core/Cargo.toml --bench user | tee bench/user.log &&
      cargo run --manifest-path core/Cargo.toml --bin comm --release | tee bench/comm.log &&
      cargo bench --manifest-path core/Cargo.toml --bench enclave --target x86_64-fortanix-unknown-sgx | tee bench/serv1.log
      '

  serv:
    build:
      context: ..
      dockerfile: star/Dockerfile.bench
    devices:
      - /dev/sgx_enclave:/dev/sgx_enclave
      - /dev/sgx_provision:/dev/sgx_provision
    volumes:
      - /run/aesmd/aesm.socket:/run/aesmd/aesm.socket
    command: >-
      bash -c 'socat TCP-LISTEN:5555,fork,reuseaddr UNIX-CONNECT:/run/aesmd/aesm.socket &
      cargo bench --manifest-path system/serv/app/Cargo.toml | tee bench/serv2.log'

  sidechannel:
    build:
      context: ..
      dockerfile: star/core/analysis/Dockerfile
    volumes: 
      - ./bench:/workspace/star/bench

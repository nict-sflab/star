services:
  aesmd:
      image: ghcr.io/oasisprotocol/aesmd-dcap:master
      devices:
        - /dev/sgx_enclave
        - /dev/sgx_provision
      volumes:
        - aesmd:/var/run/aesmd
        - ./sgx_default_qcnl.conf:/etc/sgx_default_qcnl.conf:ro

  ecdaa-rs:
    build:
      context: ..
      dockerfile: star/Dockerfile.bench
    volumes:
      - ./bench:/workspace/star/bench
    command: >
      bash -o pipefail -c '
        rm -rf /tmp/ecdaa-rs &&
        git clone --depth 1 https://github.com/akakou/ecdaa-rs /tmp/ecdaa-rs &&
        cd /tmp/ecdaa-rs &&
        cargo bench 2>&1 | tee /workspace/star/bench/ecdaa-rs.log
      '

  arc:
    build:
      context: ..
      dockerfile: star/Dockerfile.bench
    volumes:
      - ./bench:/workspace/star/bench
    command: >
      bash -o pipefail -c '
        rm -rf /tmp/arc &&
        git clone --depth 1 https://github.com/cloudflareresearch/arc.git /tmp/arc &&
        cd /tmp/arc &&
        cargo bench --features suite_ristretto255 --bench arc_bench -- arc 2>&1 | tee /workspace/star/bench/arc.log
      '

  core:
    build:
      context: ..
      dockerfile: star/Dockerfile.bench
    devices:
      - /dev/sgx_enclave
      - /dev/sgx_provision
    volumes:
      - ./bench:/workspace/star/bench
    command: >
      bash -o pipefail -c '
        RUSTFLAGS="--cfg getrandom_backend=\"rdrand\" -C target-feature=+rdrand,+avx2,+bmi2,+adx,+sha" cargo bench --manifest-path core/Cargo.toml --bench enclave --target x86_64-fortanix-unknown-sgx -- --discard-baseline --noplot | tee bench/serv1.log &&
        cargo bench --manifest-path core/Cargo.toml --bench user -- --discard-baseline | tee bench/user.log &&
        cargo run --manifest-path core/Cargo.toml --bin comm --release -- --discard-baseline | tee bench/comm.log
      '

  serv:
    build:
      context: ..
      dockerfile: star/Dockerfile.bench
    depends_on:
      - aesmd
    devices:
      - /dev/sgx_enclave
      - /dev/sgx_provision
    environment:
      STAR_MAX_COUNT: "1000000"
    volumes:
      - aesmd:/run/aesmd
      - ./bench:/workspace/star/bench
    command: >
      bash -o pipefail -c '
        while [ ! -S /run/aesmd/aesm.socket ]; do sleep 0.1; done;
        cargo bench --manifest-path system/serv/app/Cargo.toml --bench "*" -- --discard-baseline --noplot | tee bench/serv2.log
      '

  sidechannel:
    build:
      context: ..
      dockerfile: star/core/analysis/Dockerfile
    volumes:
      - ./bench:/workspace/star/bench

volumes:
  aesmd:

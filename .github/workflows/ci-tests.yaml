name: CI - Run tests

on:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_VM_NAME: ${{ vars.AZURE_VM_NAME }}
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Configure SSH known_hosts
        run: |
          VM_IP=$(az vm show \
            -g "$AZURE_RESOURCE_GROUP" \
            -n "$AZURE_VM_NAME" \
            -d \
            --query publicIps \
            -o tsv)

          mkdir -p ~/.ssh
          echo "$VM_IP ${{ vars.AZURE_VM_HOST_KEY }}" \
            >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Run tests
        run: |
          az ssh vm \
            -g "$AZURE_RESOURCE_GROUP" \
            -n "$AZURE_VM_NAME" \
            -- \
          "sudo -n -u azureuser -H bash -lc 'cd /home/azureuser/star/star && exec bash .github/workflows/2_test.sh'"

name: Benchmark

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_VM_NAME: ${{ vars.AZURE_VM_NAME }}

jobs:
  bench:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'develop'

    runs-on: ubuntu-latest

    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Start VM
        run: |
          az vm start \
            -g "$AZURE_RESOURCE_GROUP" \
            -n "$AZURE_VM_NAME"

      - name: Run benchmark
        run: |
          az ssh vm \
            -g "$AZURE_RESOURCE_GROUP" \
            -n "$AZURE_VM_NAME" \
            -- \
            "cd /home/azureuser/star/star && exec sh .github/workflows/auto-bench.sh"

      - name: Stop VM
        if: always()
        run: |
          az vm deallocate \
            -g "$AZURE_RESOURCE_GROUP" \
            -n "$AZURE_VM_NAME" \
            --no-wait
  
      - name: Send webhook
        if: always()
        run: |
          ACTION_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -X POST \
            -H 'Content-Type: application/json' \
            --data "{\"text\":\"$ACTION_URL\"}" \
            "${{ secrets.WEBHOOK_URL }}"

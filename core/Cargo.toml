[package]
name = "star-core"
version = "0.1.0"
edition = "2021"

[features]
default = ["std"]
std = ["constant-time-utils/std"]
sgx = ["constant-time-utils/sgx"]

[dependencies]
constant-time-utils = { path = "../thirdparty/constant-time-utils", default-features = false }

x25519-dalek = { version = "2", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }
hpke = { version = "0.11", default-features = false, features = ["alloc", "x25519"] }
rand = { version = "0.8", default-features = false }
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }

subtle = { version = "2.6.1", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }

[target.'cfg(not(target_vendor = "teaclave"))'.dependencies]
rand = { version = "0.8", default-features = false, features = ["getrandom"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "getrandom"] }
